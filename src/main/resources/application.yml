# ===================================================================
#                      OfferWave 应用配置
# ===================================================================

server:
  port: 8080

spring:
  application:
    name: offerwave-backend
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 50MB
  datasource:
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3306/offerwave?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai}
    username: ${DB_USERNAME:}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:0}
  mail:
    host: ${MAIL_HOST:smtp.qq.com}
    port: ${MAIL_PORT:465}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          ssl:
            enable: true

mybatis-plus:
  type-aliases-package: com.offerwave.entity
  mapper-locations: classpath:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    db-config:
      logic-delete-field: is_deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

knife4j:
  enable: true
  setting:
    title: "OfferWave 平台 API 文档"
    description: "提供职位信息、用户追踪、会员管理等核心 RESTful API。"
    contact:
      name: "Xavier"
      email: "your-email@example.com"
    version: "v1.0.0"

offerwave:
  jwt:
    # Required: Base64 encoding of at least 32 random bytes.
    secret: ${JWT_SECRET:}
    expiration: ${JWT_EXPIRATION:86400000}
  security:
    # Comma-separated exact proxy addresses and browser origins; empty is safest.
    trusted-proxy-addresses: ${OFFERWAVE_TRUSTED_PROXY_ADDRESSES:}
    cors-allowed-origins: ${OFFERWAVE_CORS_ALLOWED_ORIGINS:}
  mail:
    from: ${MAIL_FROM:${MAIL_USERNAME:}}
  storage:
    root-path: ${OFFERWAVE_STORAGE_ROOT:${user.dir}/storage}
    public-url-prefix: ${OFFERWAVE_STORAGE_PUBLIC_URL_PREFIX:/uploads}
    material-image-max-size: ${OFFERWAVE_MATERIAL_IMAGE_MAX_SIZE:10485760}
