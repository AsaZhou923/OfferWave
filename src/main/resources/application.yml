# ===================================================================
#                      OfferNow 应用配置
# ===================================================================

server:
  port: 8080

spring:
  application:
    name: offernow-backend
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 50MB
  datasource:
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3306/offer_now?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:0}
  mail:
    host: ${MAIL_HOST:smtp.qq.com}
    port: ${MAIL_PORT:465}
    username: ${MAIL_USERNAME:asazhou@qq.com}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          ssl:
            enable: true

mybatis-plus:
  type-aliases-package: com.offernow.entity
  mapper-locations: classpath:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      logic-delete-field: is_deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

knife4j:
  enable: true
  setting:
    title: "OfferNow 平台 API 文档"
    description: "提供职位信息、用户追踪、会员管理等核心 RESTful API。"
    contact:
      name: "Xavier"
      email: "your-email@example.com"
    version: "v1.0.0"

offernow:
  wechat:
    appid: ${WECHAT_APPID:}
    secret: ${WECHAT_SECRET:}
  jwt:
    secret: ${JWT_SECRET:change-me-in-production}
    expiration: ${JWT_EXPIRATION:86400000}
  crawler:
    api-key: ${CRAWLER_API_KEY:}
  mail:
    from: ${MAIL_FROM:asazhou@qq.com}
  storage:
    root-path: ${OFFERNOW_STORAGE_ROOT:${user.dir}/storage}
    public-url-prefix: ${OFFERNOW_STORAGE_PUBLIC_URL_PREFIX:/uploads}
    material-image-max-size: ${OFFERNOW_MATERIAL_IMAGE_MAX_SIZE:10485760}
