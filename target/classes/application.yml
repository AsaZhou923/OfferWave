# ===================================================================
#                      OfferNow 应用配置
# ===================================================================

# 服务器配置
server:
  port: 8080

# Spring 应用配置
spring:
  application:
    name: offernow-backend
  # 数据库连接配置
  datasource:
    url: jdbc:mysql://34.146.93.206:3306/offer_now?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai
    username: offer
    password: offert123 # <--- 请替换为你的数据库密码
    driver-class-name: com.mysql.cj.jdbc.Driver
  # Redis 配置
  data:
    redis:
      host: 127.0.0.1
      port: 6379
      password: # <--- 如果你的 Redis 有密码，请填写
      database: 0

# MyBatis Plus 配置
mybatis-plus:
  # 实体类包扫描路径
  type-aliases-package: com.offernow.entity
  # Mapper XML 文件位置
  mapper-locations: classpath:/mapper/**/*.xml
  configuration:
    # 开启驼峰命名转换
    map-underscore-to-camel-case: true
    # 日志实现
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      # 全局逻辑删除配置
      logic-delete-field: is_deleted # 假如你的表有逻辑删除字段
      logic-delete-value: 1
      logic-not-delete-value: 0

# Knife4j API 文档配置
knife4j:
  enable: true
  setting:
    title: "OfferNow 平台 API 文档"
    description: "提供职位信息、用户追踪、会员管理等核心功能的 RESTful API。"
    contact:
      name: "Xavier"
      email: "your-email@example.com"
    version: "v1.0.0"

# ===================================================================
#                        自定义业务配置
# ===================================================================
offernow:
  # 微信登录配置
  wechat:
    appid: your-wechat-appid       # <--- 请替换为你的微信 AppID
    secret: your-wechat-secret     # <--- 请替换为你的微信 AppSecret
  # JWT 配置
  jwt:
    secret: your-jwt-secret-key-that-is-long-enough-to-be-secure # <--- 请替换为你的 JWT 密钥
    expiration: 86400000 # 24小时 (单位: 毫秒)
  # 内部爬虫 API Key
  crawler:
    api-key: your-secret-crawler-api-key # <--- 请替换为爬虫模块的 API Key
